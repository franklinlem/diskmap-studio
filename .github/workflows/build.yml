name: Testes e instaladores

on:
  pull_request:
  workflow_dispatch:
    inputs:
      draft_tag:
        description: Tag de uma versão em rascunho para receber os instaladores
        type: string
        required: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Bibliotecas Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Pacote Debian e distribuição portátil
        run: packaging/linux.sh "$(python -c 'from diskmap import __version__; print(__version__)')"
      - name: Anexar pacotes ao rascunho
        if: inputs.draft_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          test "$(gh release view "$DRAFT_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$DRAFT_TAG" artifacts/*.deb artifacts/*.tar.gz

  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Congelar e executar
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name DiskMapStudio --icon packaging/icon.ico --add-data 'diskmap/assets/icon.png:diskmap/assets' launch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath 'dist\DiskMapStudio\DiskMapStudio.exe' -ArgumentList '--smoke' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke excedeu 30 s' }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Compilar instalador Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = python -c 'from diskmap import __version__; print(__version__)'
          & $compiler "/DAppVersion=$version" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar instalação silenciosa e abrir app instalado
        shell: pwsh
        run: |
          $setup = (Get-ChildItem artifacts\*-setup.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP DiskMapStudio
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -PassThru -Wait
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          $process = Start-Process (Join-Path $target DiskMapStudio.exe) -ArgumentList '--smoke' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'Smoke excedeu 30 s' }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Anexar instalador ao rascunho
        if: inputs.draft_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        shell: pwsh
        run: |
          $draft = gh release view $env:DRAFT_TAG --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'A versão precisa ser um rascunho' }
          $installer = (Get-ChildItem artifacts\*-setup.exe | Select-Object -First 1).FullName
          gh release upload $env:DRAFT_TAG $installer
